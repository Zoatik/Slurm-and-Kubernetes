name: Demo CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pull the prebuilt Slurm image
        run: |
          docker pull giovtorres/slurm-docker-cluster:26.05.2
          docker tag giovtorres/slurm-docker-cluster:26.05.2 slurm-docker-cluster:26.05.2

      - name: Run both jobs and write the report
        run: make demo DEMO_REPORT=demo-report.txt

      - name: Check the report
        run: |
          grep -Fq 'Tracking   : state COMPLETED' demo-report.txt
          grep -Fq 'Tracking   : Job Complete' demo-report.txt
          test "$(grep -c '^Last number: [0-9]' demo-report.txt)" -eq 2

      - name: Upload report.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo-report.txt
          if-no-files-found: warn
